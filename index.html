<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1013">
<title>Apuração 2º Turno</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: placar fixo no topo (lado a lado, barra única), abaixo gráfico de evolução e grade de 27 UFs. Dark-first, pensado para tela de celular. */
:root{
  --bg:#0e1013; --panel:#16191e; --line:#262b33; --fg:#eef0f3; --muted:#8c94a1;
  --a:#3b63ff; --b:#e03c3c; --ok:#2fb36b; --warn:#e0a63c;
  --display:"Archivo",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f3f4f6; --panel:#ffffff; --line:#dde1e7; --fg:#15181d; --muted:#5e6673; --a:#2a4fe6; --b:#c82f2f; color-scheme:light } }
:root[data-theme="light"]{ --bg:#f3f4f6; --panel:#ffffff; --line:#dde1e7; --fg:#15181d; --muted:#5e6673; --a:#2a4fe6; --b:#c82f2f; color-scheme:light }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--display);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px}
.wrap{max-width:720px;margin:0 auto;display:grid;gap:14px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{font-size:1rem;margin:0;font-weight:600;letter-spacing:.02em}
.live{font-family:var(--mono);font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:p 1.6s infinite}
.dot.off{background:var(--warn);animation:none}
@keyframes p{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}
.placar{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.cands{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c{min-width:0}
.c.r{text-align:right}
.c .nm{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c .pc{font-size:clamp(2.4rem,11vw,3.6rem);font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:4px}
.c .pc small{font-size:.45em;font-weight:600;color:var(--muted)}
.c .vt{font-family:var(--mono);font-size:.74rem;color:var(--muted);margin-top:4px}
.c.a .pc{color:var(--a)} .c.b .pc{color:var(--b)}
.bar{position:relative;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin:14px 0 10px;display:flex}
.bar i{display:block;height:100%;transition:width .6s}
.bar .fa{background:var(--a)} .bar .fb{background:var(--b)}
.bar:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--fg);opacity:.7}
.meta{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:.74rem;color:var(--muted);flex-wrap:wrap}
.meta b{color:var(--fg);font-weight:500}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.pill.def{background:var(--ok);color:#06240f}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h2{margin:0 0 10px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
svg{width:100%;height:auto;display:block}
.ufs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.uf{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;border-left-width:4px}
.uf .s{display:flex;justify-content:space-between;font-weight:800;font-size:.95rem}
.uf .s span:last-child{font-family:var(--mono);font-weight:500;font-size:.78rem;color:var(--muted)}
.uf .d{font-family:var(--mono);font-size:.74rem;margin-top:3px;font-variant-numeric:tabular-nums}
.uf.la{border-left-color:var(--a)} .uf.lb{border-left-color:var(--b)}
.uf .p{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.uf .p i{display:block;height:100%;background:var(--muted)}
.err{color:var(--warn);font-family:var(--mono);font-size:.78rem}
.foot{font-family:var(--mono);font-size:.7rem;color:var(--muted);text-align:center}
.foot a{color:inherit}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Presidente · 2º turno · 25/10/2026</h1>
    <div class="live"><span class="dot" id="dot"></span><span id="status">conectando ao TSE…</span></div>
  </header>

  <section class="placar" id="placar">
    <div class="cands">
      <div class="c a"><div class="nm" id="nmA">—</div><div class="pc" id="pcA">—</div><div class="vt" id="vtA"></div></div>
      <div class="c b r"><div class="nm" id="nmB">—</div><div class="pc" id="pcB">—</div><div class="vt" id="vtB"></div></div>
    </div>
    <div class="bar"><i class="fa" id="fa" style="width:50%"></i><i class="fb" id="fb" style="width:50%"></i></div>
    <div class="meta">
      <span>Urnas <b id="pst">—</b></span>
      <span>Diferença <b id="dif">—</b></span>
      <span id="def"></span>
    </div>
    <div class="meta" style="margin-top:6px">
      <span>Brancos <b id="vb">—</b></span><span>Nulos <b id="vn">—</b></span><span>Abstenção <b id="ab">—</b></span>
    </div>
  </section>

  <section class="card">
    <h2>Evolução dos votos válidos × urnas apuradas</h2>
    <svg id="chart" viewBox="0 0 640 260" role="img" aria-label="Evolução do percentual dos candidatos"></svg>
    <div class="err" id="chartMsg"></div>
  </section>

  <section class="card">
    <h2>Por estado</h2>
    <div class="ufs" id="ufs"></div>
  </section>

  <p class="foot">Fonte: TSE (arquivos oficiais de totalização), via API própria · atualiza a cada 30 s · <span id="ts"></span></p>
</div>

<script>
const API = "https://jzsuqorksqumwhpluvnh.supabase.co/functions/v1/apuracao";
const $ = id => document.getElementById(id);
const fmtP = x => x == null ? "—" : x.toFixed(2).replace(".", ",") + "%";
const fmtN = x => x == null ? "—" : x.toLocaleString("pt-BR");
const short = n => n.replace("FLAVIO BOLSONARO","Flávio Bolsonaro").replace("LULA","Lula");
let cor = {}; // numero -> 'a' | 'b'

function renderBR(d){
  const [A,B] = d.candidatos;
  if(!A||!B) return;
  if(!cor[A.numero]){ cor = {}; cor[A.numero]="a"; cor[B.numero]="b"; }
  // mantém posição estável por número de urna (22 à esquerda, 13 à direita) para não "pular" quando a liderança muda
  const left = d.candidatos.find(c=>cor[c.numero]==="a"), right = d.candidatos.find(c=>cor[c.numero]==="b");
  $("nmA").textContent = `${short(left.nome).split(" ")[0]} · ${left.partido||""}`;
  $("nmB").textContent = `${short(right.nome).split(" ")[0]} · ${right.partido||""}`;
  $("pcA").innerHTML = fmtP(left.pct).replace("%","<small>%</small>");
  $("pcB").innerHTML = fmtP(right.pct).replace("%","<small>%</small>");
  $("vtA").textContent = fmtN(left.votos)+" votos";
  $("vtB").textContent = fmtN(right.votos)+" votos";
  $("fa").style.width = left.pct+"%"; $("fb").style.width = right.pct+"%";
  $("pst").textContent = fmtP(d.urnas_apuradas_pct);
  $("dif").textContent = `${(d.diferenca_pp??0).toFixed(2).replace(".",",")} p.p. (${fmtN(d.diferenca_votos)})`;
  $("def").innerHTML = d.matematicamente_definido==="s" ? `<span class="pill def">Definido · ${short(d.lider)}</span>` : `<span>${short(d.lider||"")} lidera</span>`;
  $("vb").textContent = fmtP(d.brancos.pct); $("vn").textContent = fmtP(d.nulos.pct); $("ab").textContent = fmtP(d.abstencao.pct);
  $("status").textContent = "TSE " + (d.atualizado||"").slice(11);
  $("ts").textContent = "lido às " + new Date().toLocaleTimeString("pt-BR");
}

function renderUFs(list){
  const el = $("ufs"); el.innerHTML = "";
  list.sort((x,y)=>x.uf.localeCompare(y.uf)).forEach(s=>{
    const div = document.createElement("div");
    if(s.erro||!s.candidatos||!s.candidatos.length){ div.className="uf"; div.innerHTML=`<div class="s"><span>${s.uf}</span></div><div class="d">sem dados</div>`; el.appendChild(div); return; }
    const [l,r] = s.candidatos; const k = cor[l.numero]||"a";
    div.className = `uf l${k}`;
    div.innerHTML = `<div class="s"><span>${s.uf}</span><span>${fmtP(s.urnas_apuradas_pct).replace(",00","")}</span></div>
      <div class="d"><b>${short(l.nome).split(" ")[0]}</b> ${fmtP(l.pct)}</div>
      <div class="d" style="color:var(--muted)">${short(r.nome).split(" ")[0]} ${fmtP(r.pct)}</div>
      <div class="p"><i style="width:${s.urnas_apuradas_pct||0}%"></i></div>`;
    el.appendChild(div);
  });
}

function renderChart(pontos){
  const svg = $("chart"); svg.innerHTML = "";
  if(!pontos||pontos.length<2){ $("chartMsg").textContent = pontos&&pontos.length===1 ? "Primeiro ponto registrado; a linha aparece a partir da próxima atualização." : "Ainda sem série histórica."; return; }
  $("chartMsg").textContent = "";
  const W=640,H=260,L=56,R=14,T=14,B=34;
  const nums = Object.keys(cor); if(!nums.length) return;
  const series = nums.map(n=>({k:cor[n], pts:pontos.map(p=>({x:p.pst, y:(p.candidatos.find(c=>c.numero===n)||{}).pct})).filter(p=>p.y!=null)}));
  const ys = series.flatMap(s=>s.pts.map(p=>p.y));
  let y0=Math.min(...ys), y1=Math.max(...ys); const pad=Math.max(0.5,(y1-y0)*0.3); y0=Math.floor((y0-pad)*2)/2; y1=Math.ceil((y1+pad)*2)/2;
  const x0 = Math.floor(Math.min(...pontos.map(p=>p.pst))/10)*10, x1=100;
  const X=v=>L+(v-x0)/(x1-x0)*(W-L-R), Y=v=>T+(y1-v)/(y1-y0)*(H-T-B);
  const ns="http://www.w3.org/2000/svg", mk=(t,a)=>{const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const g = mk("g",{"font-family":"IBM Plex Mono, monospace","font-size":"15","fill":"var(--muted)"});
  const steps = (y1-y0)<=3 ? 0.5 : 1;
  for(let v=y0; v<=y1+1e-9; v+=steps){ g.appendChild(mk("line",{x1:L,x2:W-R,y1:Y(v),y2:Y(v),stroke:"var(--line)","stroke-width":"1"})); const t=mk("text",{x:L-6,y:Y(v)+4,"text-anchor":"end"}); t.textContent=v.toFixed(1).replace(".",","); g.appendChild(t); }
  for(let v=x0; v<=100; v+=10){ const t=mk("text",{x:X(v),y:H-10,"text-anchor":"middle"}); t.textContent=v+"%"; g.appendChild(t); }
  g.appendChild(mk("line",{x1:L,x2:W-R,y1:Y(50),y2:Y(50),stroke:"var(--fg)","stroke-dasharray":"3 4","stroke-width":"1",opacity:".5"}));
  svg.appendChild(g);
  series.forEach(s=>{
    const d = s.pts.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
    svg.appendChild(mk("path",{d,fill:"none",stroke:`var(--${s.k})`,"stroke-width":"2.5","stroke-linejoin":"round"}));
    const last = s.pts[s.pts.length-1]; svg.appendChild(mk("circle",{cx:X(last.x),cy:Y(last.y),r:"4",fill:`var(--${s.k})`}));
  });
}

async function get(q){ const r = await fetch(API+q,{cache:"no-store"}); if(!r.ok) throw new Error(r.status); return r.json(); }
async function tick(){
  try{
    const todas = await get("?uf=todas");
    renderBR(todas.brasil); renderUFs(todas.estados); $("dot").className="dot";
    try{ renderChart((await get("?historico=1")).pontos); }catch(e){ $("chartMsg").textContent="Histórico indisponível no momento."; }
  }catch(e){ $("dot").className="dot off"; $("status").textContent="sem resposta do TSE — tentando de novo"; }
}
tick(); setInterval(tick, 30000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) tick(); });
</script>

</body>
</html>
